<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alma Mater</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f3f3;
  color: #111;
}
.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}
h1 {
  text-align: center;
  margin-bottom: 4px;
}
.tagline {
  text-align: center;
  font-size: 14px;
  color: #666;
  margin-bottom: 12px;
}
button {
  width: 100%;
  padding: 10px;
  margin-bottom: 6px;
  font-size: 15px;
  border: none;
  border-radius: 6px;
  background: #111;
  color: white;
  cursor: pointer;
}
.card {
  background: white;
  padding: 16px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
img {
  width: 100%;
  border-radius: 8px;
}
.name {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}
.sport {
  text-align: center;
  color: #777;
  margin-bottom: 10px;
}
input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
.feedback {
  text-align: center;
  font-weight: bold;
  margin-top: 10px;
}
.correct { color: #1a7f37; }
.wrong { color: #b42318; }
.stats {
  text-align: center;
  margin-top: 12px;
  font-size: 14px;
}
.section {
  margin-top: 16px;
}
.achievement {
  background: #eee;
  padding: 6px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.unlocked {
  background: #d6f5dd;
}
</style>
</head>

<body>
<div class="container">
  <h1>Alma Mater</h1>
  <div class="tagline">Name the college. Test your ball knowledge.</div>

  <button onclick="setMode('normal')">Normal Mode</button>
  <button onclick="setMode('daily')">Daily Challenge</button>

  <div class="card">
    <img id="athleteImg">
    <div id="athleteName" class="name"></div>
    <div id="athleteSport" class="sport"></div>
    <input id="answerInput" placeholder="Type the college..." autocomplete="off">
    <div id="feedback" class="feedback"></div>
  </div>

  <div class="stats">
    Streak: <span id="streak">0</span> |
    Best: <span id="best">0</span> |
    Daily: <span id="daily">0</span>/10
  </div>

  <div class="section">
    <strong>Achievements</strong>
    <div id="achievements"></div>
  </div>
</div>

<script>
/* ---------- ELEMENTS ---------- */
const athleteImg = document.getElementById("athleteImg");
const athleteName = document.getElementById("athleteName");
const athleteSport = document.getElementById("athleteSport");
const answerInput = document.getElementById("answerInput");
const feedback = document.getElementById("feedback");
const streakEl = document.getElementById("streak");
const bestEl = document.getElementById("best");
const dailyEl = document.getElementById("daily");
const achievementsBox = document.getElementById("achievements");

/* ---------- DATA ---------- */
const athletes = [
  {name:"Damian Lillard", sport:"NBA", college:"Weber State", img:"https://upload.wikimedia.org/wikipedia/commons/3/3f/Damian_Lillard_2021.jpg"},
  {name:"CJ McCollum", sport:"NBA", college:"Lehigh", img:"https://upload.wikimedia.org/wikipedia/commons/8/8f/CJ_McCollum_2021.jpg"},
  {name:"Ja Morant", sport:"NBA", college:"Murray State", img:"https://upload.wikimedia.org/wikipedia/commons/2/2a/Ja_Morant_2022.jpg"},
  {name:"Paul George", sport:"NBA", college:"Fresno State", img:"https://upload.wikimedia.org/wikipedia/commons/5/5a/Paul_George_2021.jpg"},
  {name:"Josh Allen", sport:"NFL", college:"Wyoming", img:"https://upload.wikimedia.org/wikipedia/commons/7/7a/Josh_Allen_Bills.jpg"},
  {name:"Cooper Kupp", sport:"NFL", college:"Eastern Washington", img:"https://upload.wikimedia.org/wikipedia/commons/3/3d/Cooper_Kupp_2022.jpg"},
  {name:"Khalil Mack", sport:"NFL", college:"Buffalo", img:"https://upload.wikimedia.org/wikipedia/commons/5/55/Khalil_Mack_2020.jpg"},
  {name:"Joe Flacco", sport:"NFL", college:"Delaware", img:"https://upload.wikimedia.org/wikipedia/commons/0/0e/Joe_Flacco_2019.jpg"},
  {name:"Steve McNair", sport:"NFL", college:"Alcorn State", img:"https://upload.wikimedia.org/wikipedia/commons/6/6c/Steve_McNair.jpg"}
];

/* ---------- STATE ---------- */
let queue = shuffle([...athletes]);
let index = 0;
let current;
let streak = 0;
let best = localStorage.getItem("best") || 0;
let daily = 0;

/* ---------- HELPERS ---------- */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function normalize(text) {
  return text.toLowerCase()
    .replace("university", "")
    .replace("college", "")
    .replace(/[^a-z\s]/g, "")
    .trim();
}

/* ---------- GAME LOGIC ---------- */
function nextAthlete() {
  if (index >= queue.length) {
    queue = shuffle([...athletes]);
    index = 0;
  }
  current = queue[index++];
  athleteImg.src = current.img;
  athleteName.textContent = current.name;
  athleteSport.textContent = current.sport;
}

answerInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const correct = normalize(answerInput.value) === normalize(current.college);
    if (correct) {
      streak++;
      daily++;
      feedback.textContent = "Correct";
      feedback.className = "feedback correct";
    } else {
      streak = 0;
      feedback.textContent = "Wrong: " + current.college;
      feedback.className = "feedback wrong";
    }
    if (streak > best) {
      best = streak;
      localStorage.setItem("best", best);
    }
    updateStats();
    answerInput.value = "";
    setTimeout(nextAthlete, 800);
  }
});

function setMode() {
  streak = 0;
  daily = 0;
  queue = shuffle([...athletes]);
  index = 0;
  nextAthlete();
  updateStats();
}

function updateStats() {
  streakEl.textContent = streak;
  bestEl.textContent = best;
  dailyEl.textContent = daily;
}

/* ---------- INIT ---------- */
bestEl.textContent = best;
nextAthlete();
</script>
</body>
</html>
