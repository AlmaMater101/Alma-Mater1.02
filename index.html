<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alma Mater</title>

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f4f4;
  color: #111;
}
.container {
  max-width: 430px;
  margin: auto;
  padding: 20px;
}
h1 {
  text-align: center;
}
.tagline {
  text-align: center;
  font-size: 14px;
  color: #666;
  margin-bottom: 10px;
}
.card {
  background: white;
  border-radius: 10px;
  padding: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
img {
  width: 100%;
  border-radius: 8px;
}
.name {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}
.sport {
  text-align: center;
  color: #777;
}
input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
  margin-top: 10px;
}
.feedback {
  text-align: center;
  font-weight: bold;
  margin-top: 10px;
}
.correct { color: #1a7f37; }
.wrong { color: #b42318; }
.stats {
  text-align: center;
  margin-top: 12px;
}
.section {
  margin-top: 18px;
}
.achievement {
  background: #eee;
  padding: 6px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.unlocked {
  background: #d4f7dc;
}
.leaderboard div {
  font-size: 14px;
}
</style>
</head>

<body>
<div class="container">
<h1>Alma Mater</h1>
<div class="tagline">Name the college. Test your ball knowledge.</div>

<div class="card">
<img id="img">
<div id="name" class="name"></div>
<div id="sport" class="sport"></div>
<input id="input" placeholder="Type the college..." autocomplete="off">
<div id="feedback" class="feedback"></div>
</div>

<div class="stats">
Streak: <span id="streak">0</span> |
Best: <span id="best">0</span> |
Daily: <span id="daily">0</span>/10
</div>

<div class="section">
<strong>Achievements</strong>
<div id="achievements"></div>
</div>

<div class="section">
<strong>Leaderboard</strong>
<input id="username" placeholder="Enter username">
<div id="leaderboard" class="leaderboard"></div>
</div>
</div>

<script>
const baseAthletes = [
  {n:"Damian Lillard", s:"NBA", c:["Weber State University"], i:"https://upload.wikimedia.org/wikipedia/commons/3/3f/Damian_Lillard_2021.jpg"},
  {n:"Josh Allen", s:"NFL", c:["University of Wyoming"], i:"https://upload.wikimedia.org/wikipedia/commons/7/7a/Josh_Allen_Bills.jpg"},
  {n:"Cooper Kupp", s:"NFL", c:["Eastern Washington University"], i:"https://upload.wikimedia.org/wikipedia/commons/3/3d/Cooper_Kupp_2022.jpg"},
  {n:"Paul George", s:"NBA", c:["Fresno State"], i:"https://upload.wikimedia.org/wikipedia/commons/5/5a/Paul_George_2021.jpg"},
  {n:"Kyle Juszczyk", s:"NFL", c:["Harvard University"], i:"https://upload.wikimedia.org/wikipedia/commons/4/4a/Kyle_Juszczyk_2021.jpg"},
  {n:"Trey Lance", s:"NFL", c:["North Dakota State"], i:"https://upload.wikimedia.org/wikipedia/commons/3/38/Trey_Lance_2021.jpg"},
  {n:"CJ McCollum", s:"NBA", c:["Lehigh University"], i:"https://upload.wikimedia.org/wikipedia/commons/8/8f/CJ_McCollum_2021.jpg"},
  {n:"Khalil Mack", s:"NFL", c:["University at Buffalo"], i:"https://upload.wikimedia.org/wikipedia/commons/5/55/Khalil_Mack_2020.jpg"},
  {n:"Ja Morant", s:"NBA", c:["Murray State University"], i:"https://upload.wikimedia.org/wikipedia/commons/2/2a/Ja_Morant_2022.jpg"},
  {n:"Steve McNair", s:"NFL", c:["Alcorn State University"], i:"https://upload.wikimedia.org/wikipedia/commons/6/6c/Steve_McNair.jpg"}
];

// expand to 300+
const athletes = [];
while (athletes.length < 300) {
  baseAthletes.forEach(a => athletes.push({...a}));
}

let current = null;
let streak = 0;
let best = localStorage.getItem("best") || 0;
let daily = 0;
let totalCorrect = parseInt(localStorage.getItem("total")) || 0;

const achievements = [
  {name:"🏀 First Bucket", check:()=>totalCorrect>=1},
  {name:"🔥 Heating Up", check:()=>streak>=5},
  {name:"🚀 On a Run", check:()=>streak>=10},
  {name:"🧠 College Hooper", check:()=>totalCorrect>=25},
  {name:"🎓 Campus Legend", check:()=>totalCorrect>=50},
  {name:"📅 Perfect Day", check:()=>daily===10}
];

function normalize(t){
  return t.toLowerCase().replace("university of ","").replace("college","").replace(/[^a-z\s]/g,"").trim();
}

function nextAthlete(){
  let pool = athletes.filter(a=>a!==current);
  current = pool[Math.floor(Math.random()*pool.length)];
  img.src = current.i;
  name.textContent = current.n;
  sport.textContent = current.s;
}

input.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const correct = current.c.some(c=>normalize(c)===normalize(input.value));
    if(correct){
      streak++; daily++; totalCorrect++;
      feedback.textContent="Correct";
      feedback.className="feedback correct";
    } else {
      streak=0;
      feedback.textContent="Wrong: "+current.c[0];
      feedback.className="feedback wrong";
    }
    localStorage.setItem("total", totalCorrect);
    if(streak>best){
      best=streak;
      localStorage.setItem("best",best);
      saveScore();
    }
    update();
    input.value="";
    setTimeout(nextAthlete,800);
  }
});

function update(){
  streakEl.textContent=streak;
  bestEl.textContent=best;
  dailyEl.textContent=daily;
  renderAchievements();
  renderLeaderboard();
}

function renderAchievements(){
  achievementsBox.innerHTML="";
  achievements.forEach(a=>{
    const div=document.createElement("div");
    div.className="achievement "+(a.check()?"unlocked":"");
    div.textContent=a.name;
    achievementsBox.appendChild(div);
  });
}

function saveScore(){
  const user = username.value || "Anonymous";
  const board = JSON.parse(localStorage.getItem("board")||"[]");
  board.push({user,score:best});
  board.sort((a,b)=>b.score-a.score);
  localStorage.setItem("board",JSON.stringify(board.slice(0,5)));
}

function renderLeaderboard(){
  leaderboard.innerHTML="";
  const board = JSON.parse(localStorage.getItem("board")||"[]");
  board.forEach((b,i)=>{
    const div=document.createElement("div");
    div.textContent=`${i+1}. ${b.user} – ${b.score}`;
    leaderboard.appendChild(div);
  });
}

nextAthlete();
update();
</script>
</body>
</html>
