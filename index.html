<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alma Mater</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
}
.container {
  max-width: 450px;
  margin: auto;
  padding: 18px;
}
h1 {
  text-align: center;
  margin-bottom: 10px;
}
button {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  border: none;
  border-radius: 6px;
  background: #111;
  color: white;
  cursor: pointer;
  font-size: 15px;
}
.card {
  background: white;
  padding: 14px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
img {
  width: 100%;
  border-radius: 8px;
}
.name {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-top: 8px;
}
.sport {
  text-align: center;
  color: #555;
}
input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  font-size: 16px;
}
.feedback {
  text-align: center;
  font-weight: bold;
  margin-top: 10px;
}
.correct { color: #1a7f37; }
.wrong { color: #b42318; }
.stats {
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
}
.section {
  margin-top: 14px;
}
.achievement {
  background: #eee;
  padding: 6px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.unlocked {
  background: #d6f5dd;
}
</style>
</head>
<body>

<div class="container">
  <h1>Alma Mater</h1>

  <button onclick="setMode('daily')">Daily Challenge (20)</button>
  <button onclick="setMode('normal')">Normal Mode</button>

  <div class="card">
    <img id="playerImg">
    <div id="playerName" class="name"></div>
    <div id="playerSport" class="sport"></div>
    <input id="collegeInput" placeholder="Enter college (e.g., Michigan)">
    <div id="feedback" class="feedback"></div>
  </div>

  <div class="stats">
    Streak: <span id="streak">0</span> |
    Best: <span id="best">0</span> |
    Daily: <span id="dailyCount">0</span>/20
  </div>

  <div class="section">
    <strong>Achievements</strong>
    <div id="achievements"></div>
  </div>
</div>

const achievementsBox = document.getElementById("achievements");

let best = parseInt(localStorage.getItem("best") || "0");
bestEl.textContent = best;

// NORMALIZATION
function normalize(text) {
  return text.toLowerCase()
    .replace(/university|college|of|the/g, "")
    .replace(/[^a-z]/g, "")
    .trim();
}

let streak = 0;
let dailyCount = 0;
let mode = 'normal';
let order = [];
let idx = 0;

// ACHIEVEMENTS
const achievementsList = [
  {name:"First Strike", desc:"Get your first correct answer", unlocked:false, check:()=>streak>=1},
  {name:"Triple Threat", desc:"Get 3 correct in a row", unlocked:false, check:()=>streak>=3},
  {name:"Streak Master", desc:"10 correct in a row", unlocked:false, check:()=>streak>=10},
  {name:"Daily Champ", desc:"Complete all 20 Daily Challenge", unlocked:false, check:()=>mode==='daily' && dailyCount>=20},
  {name:"Century Club", desc:"Answer 100 questions total", unlocked:false, check:()=>totalAnswered>=100}
];
let totalAnswered = 0;

// BUILD ORDER
function buildOrder() {
  order = [...players];
  if(mode==='daily'){
    const seed = new Date().toISOString().slice(0,10); // yyyy-mm-dd
    order.sort(()=>seed.charCodeAt(0)%2-0.5);
    order = order.slice(0,20);
  } else {
    order.sort(()=>Math.random()-0.5);
  }
  idx=0;
}

// LOAD PLAYER
function loadPlayer() {
  if(idx>=order.length) buildOrder();
  const p = order[idx++];
  playerImg.src=p.img;
  playerName.textContent=p.name;
  playerSport.textContent=p.sport;
  feedbackEl.textContent="";
}

// ACHIEVEMENTS UPDATE
function updateAchievements() {
  achievementsBox.innerHTML="";
  achievementsList.forEach(a=>{
    a.unlocked=a.check();
    const div = document.createElement("div");
    div.className="achievement "+(a.unlocked?"unlocked":"");
    div.textContent=a.name+": "+a.desc;
    achievementsBox.appendChild(div);
  });
}

// INPUT HANDLER
collegeInput.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const answer = normalize(collegeInput.value);
    const correct = normalize(order[idx-1].college)===answer;
    totalAnswered++;
    if(correct){
      streak++; dailyCount++;
      feedbackEl.textContent="Correct!";
      feedbackEl.className="feedback correct";
    } else {
      streak=0;
      feedbackEl.textContent="Wrong! Answer: "+order[idx-1].college;
      feedbackEl.className="feedback wrong";
    }
    if(streak>best){best=streak; localStorage.setItem("best",best); bestEl.textContent=best;}
    streakEl.textContent=streak;
    dailyCountEl.textContent=dailyCount;
    updateAchievements();
    collegeInput.value="";
    setTimeout(loadPlayer,700);
  }
});

// MODE SWITCH
function setMode(m){
  mode=m;
  streak=0;
  dailyCount=0;
  totalAnswered=0;
  streakEl.textContent=streak;
  dailyCountEl.textContent=dailyCount;
  buildOrder();
  loadPlayer();
  updateAchievements();
}

// INITIAL LOAD
buildOrder();
loadPlayer();
updateAchievements();
